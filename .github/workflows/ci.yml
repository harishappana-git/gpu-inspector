name: Development checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gri-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Reproduce the initial development toolchain; not a latest/security claim.
  GOTOOLCHAIN: local

jobs:
  source-checks:
    name: Go and CPU harness (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      # Official repository v7 refs verified 2026-09-06; pin complete commit IDs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.24.5'
          check-latest: false
          cache: false
      - name: Unit and fixture tests
        run: make test
      - name: Race detector
        run: make test-race
      - name: Static analysis
        run: make vet
      - name: H100 runner syntax and hermetic orchestration
        if: runner.os == 'Linux'
        run: |
          bash -n scripts/build-linux-h100.sh scripts/run-h100.sh scripts/test-h100-runner.sh
          bash scripts/test-h100-runner.sh
          bash -n scripts/setup-h100.sh scripts/test-h100-setup.sh scripts/remote-h100-job.sh
          bash scripts/test-h100-setup.sh
          bash -n scripts/test-remote-h100-job.sh
          bash scripts/test-remote-h100-job.sh
      - name: H100 controller and campaign fixtures (no GPU or SSH)
        run: python3 -m unittest discover -s scripts -p 'test_h100_*.py' -v
      - name: Build CLI
        run: make build
      - name: CPU known-answer and synthetic-corruption harness
        run: make worker-cpu
      - name: Linux native NVML adapter compile and tests
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: '1'
        run: |
          go test ./internal/collect
          go build -trimpath -o bin/gri-linux-native ./cmd/gri
      - name: Linux amd64 cgo-free fallback build
        run: make build-linux
      - name: Synthetic CLI report workflow
        run: |
          ./bin/gri demo --scenario clean --output ./build/ci-demo-clean
          ./bin/gri verify --report-dir ./build/ci-demo-clean
          ./bin/gri checklist --report ./build/ci-demo-clean/report.json --json > ./build/ci-checklist.json
          ./bin/gri export --report-dir ./build/ci-demo-clean --output ./build/ci-demo-share
          ./bin/gri verify --report-dir ./build/ci-demo-share

  windows-checks:
    name: Native Windows Go and MSVC CPU harness
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.24.5'
          check-latest: false
          cache: false
      - name: Unit, Windows ACL, process cleanup and fixture tests
        run: go test ./...
      - name: Race detector with runner GCC
        env:
          CGO_ENABLED: '1'
          CC: gcc
        run: go test -race ./...
      - name: Static analysis
        run: go vet ./...
      - name: H100 controller and campaign fixtures (no GPU or SSH)
        run: python -m unittest discover -s scripts -p 'test_h100_*.py' -v
      - name: Build native CLI
        run: go build -trimpath -o bin/gri.exe ./cmd/gri
      - name: Configure MSVC CPU harness
        run: cmake -S worker -B build/worker-cpu-windows -G "Visual Studio 17 2022" -A x64 -DGRI_BUILD_CUDA=OFF
      - name: Build MSVC CPU harness
        run: cmake --build build/worker-cpu-windows --config Release --parallel 2
      - name: CPU known answers and synthetic corruption
        run: ctest --test-dir build/worker-cpu-windows -C Release --output-on-failure
      - name: Synthetic Windows report workflow
        run: |
          & ./bin/gri.exe demo --scenario clean --output ./build/ci-windows-demo-clean
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./bin/gri.exe verify --report-dir ./build/ci-windows-demo-clean
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./bin/gri.exe export --report-dir ./build/ci-windows-demo-clean --output ./build/ci-windows-demo-share
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./bin/gri.exe verify --report-dir ./build/ci-windows-demo-share
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # No deployment, production signing, provider credentials or GPU allocation.
  # CUDA compilation and real-device acceptance are separate release gates.
